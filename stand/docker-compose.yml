# Стенд LLM: Ollama (backend) + Open WebUI (веб-интерфейс).
# Запуск: docker compose --env-file ../.env.stand up -d
services:
  ollama:
    image: ollama/ollama:latest
    container_name: stand-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: stand-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # Мульти-юзер (этап 3.5): регистрация открыта, но новые ждут одобрения админа
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=pending
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - ollama

  speech:
    image: ghcr.io/matatonic/openedai-speech:latest
    container_name: stand-speech
    restart: unless-stopped
    ports:
      - "${SPEECH_PORT:-8000}:8000"
    volumes:
      - speech_voices:/app/voices
      - speech_config:/app/config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tts-worker:
    build: ./tts_worker
    container_name: stand-tts-worker
    restart: unless-stopped
    ports:
      - "${TTS_PORT:-8001}:8000"
    volumes:
      - tts_files:/data/files
    environment:
      - LAN_BASE_URL=http://192.168.1.111:8001
    depends_on:
      - speech

volumes:
  ollama_models:
  webui_data:
  speech_voices:
  speech_config:
  tts_files:

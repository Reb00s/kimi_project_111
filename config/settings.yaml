# Основные настройки агента
agent:
  model: ${LLM_MODEL}
  temperature: 0.2
  max_tokens: 8192
  max_steps: 50            # защита от бесконечных циклов
  timeout_seconds: 600

limits:
  retries: 3
  retry_backoff_sec: 2     # экспоненциальный рост
  budget_usd_per_run: 1.0  # лимит стоимости на запуск

logging:
  level: INFO
  trace_tool_calls: true
  save_transcripts: true   # полные транскрипты в runs/<run>/logs/
